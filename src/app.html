	<body data-sveltekit-preload-data="hover">
		<div id="preloader" class="logo"></div>
		<script>
			try {
				if (sessionStorage.getItem('jellex.splashSeen') === '1')
					document.getElementById('preloader').classList.remove('logo');
				else sessionStorage.setItem('jellex.splashSeen', '1');
			} catch {}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
